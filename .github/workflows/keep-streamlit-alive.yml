# ------------------------------------------------------------------
# This GitHub Action runs on a schedule (every 25 minutes)
# and sends a GET request to your Streamlit app to keep it from sleeping.
# This version spoofs the User-Agent to appear as a regular browser.
# ------------------------------------------------------------------

name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 25 minutes
    - cron: '*/25 * * * *'
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  ping_streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP GET request to Streamlit app
        # Use a standard GET request with a common browser User-Agent.
        # -A: Sets the User-Agent string.
        # --fail: Causes the step to fail if the server returns an HTTP error code.
        # > /dev/null: Discards the HTML output so it doesn't clutter the logs.
        run: >
          curl -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36" --fail https://top-plays-airports.streamlit.app > /dev/null
