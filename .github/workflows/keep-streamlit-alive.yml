# .github/workflows/keep-streamlit-alive.yml
# ---------------------------------------------------------------
# Visits the Streamlit app every 30 min with a headless Playwright
# browser so that Community Cloud sees real WebSocket traffic and
# does not hibernate the app.
# ---------------------------------------------------------------

name: Keep Streamlit App Awake

on:
  # Every 30 minutes (safe against the 1-hour sleep timer)
  schedule:
    - cron: '*/30 * * * *'
  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  ping_streamlit_headless:
    runs-on: ubuntu-latest
    # Bail out completely if the job takes > 5 min
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Playwright and browser dependencies
        run: |
          pip install --upgrade pip
          pip install playwright
          # Installs Chromium plus required OS libs
          playwright install --with-deps chromium

      - name: Visit Streamlit app with Playwright
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import sys

          URL = "https://top-plays-airports.streamlit.app"

          print("--- Playwright heartbeat ---")

          try:
              with sync_playwright() as p:
                  print("Launching headless Chromium…")
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page()

                  print(f"Navigating to {URL} …")
                  page.goto(URL, wait_until="networkidle", timeout=120_000)

                  # Wait until the main Streamlit container is present.
                  page.wait_for_selector("div.stApp", timeout=60_000)

                  print("App fully loaded →", page.title())
                  # Keep the socket open just long enough to be counted
                  page.wait_for_timeout(5_000)

                  browser.close()
                  print("--- Done ---")

          except Exception as exc:
              print(f"ERROR: {exc}", file=sys.stderr)
              sys.exit(1)
          PY
