# .github/workflows/keep-streamlit-alive.yml
# ---------------------------------------------------------------
# Pings the Streamlit Community-Cloud app every 30 min with a
# headless Chromium browser so the platform records real traffic
# and does not hibernate the app.
# ---------------------------------------------------------------

name: Keep Streamlit App Awake

on:
  # every 30 minutes
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping_streamlit_headless:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Playwright + browser
        run: |
          pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit Streamlit app (Playwright)
        continue-on-error: true   # don’t fail the whole job for a benign timeout
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout
          import sys, time

          URL = "https://top-plays-airports.streamlit.app"
          HOLD_SECONDS = 15        # how long to keep the tab open

          print("--- Streamlit keep-alive ---")

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True,
                      args=["--disable-dev-shm-usage"]      # safer on tiny containers
                  )
                  context = browser.new_context()
                  page = context.new_page()

                  print(f"Opening {URL} …")
                  page.goto(URL, wait_until="domcontentloaded", timeout=180_000)

                  # Optional sanity-check: log title, but don’t fail if missing
                  try:
                      print("Page title →", page.title())
                  except PWTimeout:
                      print("Title not available yet (not critical)")

                  # Give Streamlit time to finish its WebSocket handshake
                  print(f"Holding connection {HOLD_SECONDS}s …")
                  time.sleep(HOLD_SECONDS)

                  browser.close()
                  print("--- Visit complete ---")

          except PWTimeout as warn:
              # Network ok but element(s) not found fast enough → warn, succeed
              print(f"WARNING (non-fatal): {warn}")
          except Exception as exc:
              # Unexpected/serious error → fail the job
              print(f"FATAL: {exc}", file=sys.stderr)
              sys.exit(1)
          PY
